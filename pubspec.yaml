name: rvaz_android
description: Regio Voorne aan Zee Android app
publish_to: "none"
version: 0.6.2+48
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.0
  flutter_html: 3.0.0-beta.2
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  share_plus: ^12.0.0
  add_2_calendar: ^3.0.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  app_links: ^6.4.1
  mobile_scanner: ^7.1.3
  qr_flutter: ^4.1.0
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  google_mobile_ads: ^9.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/rvaz-logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/rvaz-logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/rvaz-logo.png
