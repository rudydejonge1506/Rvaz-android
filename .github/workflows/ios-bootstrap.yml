name: Build RVAZ iOS App Store IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      BUNDLE_ID: nl.regiovoorneaanzee.app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Flutter project
        run: |
          flutter analyze --no-fatal-infos
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo 'Geen Flutter-tests gevonden; teststap overgeslagen.'
          fi

      - name: Install Apple signing credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$BUILD_PROVISION_PROFILE_BASE64"
          test -n "$KEYCHAIN_PASSWORD"

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST")
          case "$PROFILE_APP_ID" in
            *."$BUNDLE_ID") ;;
            *) echo "Provisioning profile does not match $BUNDLE_ID"; exit 1 ;;
          esac

      - name: Create App Store export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>XQ8MH83ZV9</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>nl.regiovoorneaanzee.app</key>
              <string>RVAZ App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Ensure iOS project exists
        run: |
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

      - name: Generate RVAZ iOS app icons
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/flutter_launcher_icons_ios.yaml" <<'YAML'
          flutter_launcher_icons:
            android: false
            ios: true
            image_path: assets/rvaz-logo.png
            remove_alpha_ios: true
            background_color_ios: "#FFFFFF"
          YAML
          # Re-encode the existing artwork losslessly for the iOS icon generator only.
          # Keep the repository image and all Android icon settings untouched.
          swift - "$PWD/assets/rvaz-logo.png" "$RUNNER_TEMP/rvaz-ios-icon.png" <<'SWIFT'
          import AppKit
          import Foundation
          let source = CommandLine.arguments[1]
          let destination = CommandLine.arguments[2]
          guard let image = NSImage(contentsOfFile: source),
                let tiff = image.tiffRepresentation,
                let bitmap = NSBitmapImageRep(data: tiff),
                let png = bitmap.representation(using: .png, properties: [:]) else {
            fatalError("Cannot decode RVAZ source logo")
          }
          try png.write(to: URL(fileURLWithPath: destination))
          SWIFT
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/rvaz-ios-icon.png"
          sed -i '' "s|image_path: assets/rvaz-logo.png|image_path: $RUNNER_TEMP/rvaz-ios-icon.png|" "$RUNNER_TEMP/flutter_launcher_icons_ios.yaml"
          dart run flutter_launcher_icons -f "$RUNNER_TEMP/flutter_launcher_icons_ios.yaml"
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png

      - name: Add required iOS privacy usage descriptions
        run: |
          set -euo pipefail
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera access is used to scan voucher QR codes." "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCalendarsUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCalendarsUsageDescription string Calendar access is used when you choose to add an event to your calendar." "$PLIST"

      - name: Build Flutter iOS release without signing
        run: |
          flutter build ios --release --no-codesign --build-name=1.1.2 --build-number=52

      - name: Configure Runner signing only
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          abort 'Runner target not found' unless target
          target.build_configurations.each do |config|
            next unless config.name == 'Release'
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('BUNDLE_ID')
            config.build_settings['DEVELOPMENT_TEAM'] = 'XQ8MH83ZV9'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'RVAZ App Store'
            config.build_settings['PROVISIONING_PROFILE'] = ENV.fetch('IOS_PROFILE_UUID')
          end
          project.save
          RUBY

      - name: Archive with Apple Distribution signing
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive

      - name: Export signed App Store IPA
        run: |
          set -euo pipefail
          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RVAZ-iOS-AppStore
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
