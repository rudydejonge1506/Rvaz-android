name: Recover RVAZ iOS 1.1.1 as 1.1.3
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  recover:
    runs-on: macos-latest
    steps:
      - name: Fetch exact successful 1.1.1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/11222800133/zip > old.zip
          unzip -q old.zip -d old
          IPA=$(find old -name '*.ipa' -print -quit)
          test -n "$IPA"
          unzip -q "$IPA" -d work
          APP=$(find work/Payload -maxdepth 1 -name '*.app' -type d -print -quit)
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "nl.regiovoorneaanzee.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.1.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "43"
      - name: Install existing RVAZ signing material
        env:
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEY_PASS: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo -n "$CERT_B64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          echo -n "$PROFILE_B64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEY_PASS" "$RUNNER_TEMP/sign.keychain-db"
          security unlock-keychain -p "$KEY_PASS" "$RUNNER_TEMP/sign.keychain-db"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/sign.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEY_PASS" "$RUNNER_TEMP/sign.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/sign.keychain-db"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
      - name: Re-version exact app and re-sign
        run: |
          set -euo pipefail
          APP=$(find work/Payload -maxdepth 1 -name '*.app' -type d -print -quit)
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.1.3' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 80' "$APP/Info.plist"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"
          rm -rf "$APP/_CodeSignature"
          ID=$(security find-identity -v -p codesigning "$RUNNER_TEMP/sign.keychain-db" | awk -F'"' '/Apple Distribution/{print $2; exit}')
          test -n "$ID"
          codesign --force --sign "$ID" --entitlements "$RUNNER_TEMP/entitlements.plist" --timestamp "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "nl.regiovoorneaanzee.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.1.3"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "80"
      - name: Package recovery IPA
        run: |
          set -euo pipefail
          mkdir -p out
          (cd work && zip -qry ../out/RVAZ-1.1.3-build80-from-exact-1.1.1.ipa Payload)
          test -s out/RVAZ-1.1.3-build80-from-exact-1.1.1.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: RVAZ-iOS-1.1.3-from-exact-1.1.1
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 14
