name: Deliver signed AAB 55 as draft attachment
on:
  push:
    branches: [ios-current-features-safe]
    paths: ['.github/workflows/rvaz-deliver-aab55.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download verified candidate
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37890032896 --jq .conclusion)" = success
          gh run download 37890032896 --repo "$GITHUB_REPOSITORY" --name RVAZ-Google-Play-55-candidate --dir candidate
          AAB=$(find candidate -name app-release.aab)
          test -n "$AAB"
          cp "$AAB" RVAZ-0.6.5-55.aab
          jarsigner -verify RVAZ-0.6.5-55.aab
          sha256sum RVAZ-0.6.5-55.aab
      - name: Attach AAB to unpublished GitHub draft only
        run: |
          gh release create rvaz-android-test-55 --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title 'RVAZ Android 0.6.5 (55) — signed test AAB' --notes 'Unpublished file delivery only. Verified original Android icon, 20 Flutter tests and Android 15 startup. Not submitted to Google Play; existing public Android and iOS releases unchanged.'
          gh release upload rvaz-android-test-55 RVAZ-0.6.5-55.aab --repo "$GITHUB_REPOSITORY"
          gh release view rvaz-android-test-55 --repo "$GITHUB_REPOSITORY" --json isDraft,url,assets
