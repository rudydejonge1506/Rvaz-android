name: Build RVAZ Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org nl.regiovoorneaanzee --project-name rvaz_android .
      - name: Configure Firebase Android
        run: |
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle.kts')
          s = settings.read_text()
          needle = 'plugins {'
          s = s.replace(needle, needle + '\n    id("com.google.gms.google-services") version "4.4.4" apply false', 1)
          settings.write_text(s)
          app = Path('android/app/build.gradle.kts')
          a = app.read_text()
          a = a.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
          app.write_text(a)
          PY
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Configure RVAZ app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = m.replace('android:label="rvaz_android"', 'android:label="Regio Voorne aan Zee"')
          manifest.write_text(m)
          PY
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Verify APK package
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-debug.apk | grep "package: name='nl.regiovoorneaanzee.rvaz_android'"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-debug.apk | grep "application-label:'Regio Voorne aan Zee'"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: RVAZ-Android-test-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
