name: Central app menu checks
on:
  push:
    branches: [feature/central-app-menu, feature/newsroom-design]
concurrency:
  group: rvaz-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
        env:
          RVAZ_TYPOGRAPHY_PREVIEW: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RVAZ-typography-preview
          path: evidence/article-typography.png
          if-no-files-found: ignore
      - run: python3 scripts/verify_icons.py

      - run: php -l backend/rvaz-native-events.php

      - run: php -l backend/rvaz-family-native-api.php
