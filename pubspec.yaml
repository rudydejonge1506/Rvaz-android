name: rvaz_android
description: Regio Voorne aan Zee Android app
publish_to: "none"
version: 0.4.6+10
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.0
  flutter_html: 3.0.0-beta.2
  flutter_secure_storage: ^9.2.4
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/rvaz-logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/rvaz-logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/rvaz-logo.png
