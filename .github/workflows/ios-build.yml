name: Build RVAZ iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project only
        run: flutter create --platforms=ios --org nl.regiovoorneaanzee --project-name rvaz_android .
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Configure iOS app identity and permissions
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Regio Voorne aan Zee" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Camera gebruiken om foto’s en video’s bij een tip te voegen.'" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Foto’s en video’s kiezen om bij een tip te voegen.'" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Media bewaren wanneer je daarvoor kiest.'" ios/Runner/Info.plist || true
      - name: Configure Firebase iOS when secret is available
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Firebase iOS-configuratie toegevoegd."
          else
            echo "Geen iOS Firebase-secret ingesteld; buildcontrole gaat door zonder GoogleService-Info.plist."
          fi
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign
      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@v4
        with:
          name: RVAZ-iOS-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
