name: Verify native Wonen renderer and built Android icons
on:
  push:
    branches: [ios-current-features-safe]
    paths: ['.github/workflows/rvaz-renderer-verify.yml', 'verification/wonen_widgets_test.dart']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Render and assert native property details
        run: |
          mkdir -p verification/screenshots
          cp verification/wonen_widgets_test.dart test/wonen_widgets_test.dart
          flutter test --update-goldens test/wonen_widgets_test.dart
          rm test/wonen_widgets_test.dart
      - name: Verify original icon pixels inside each signed Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37784300802 --jq .conclusion)" = success
          gh run download 37784300802 --repo "$GITHUB_REPOSITORY" --name RVAZ-Android-development-test-APKs --dir /tmp/rvaz-built
          python3 -m pip install Pillow
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          for APK in /tmp/rvaz-built/*.apk; do
            "$AAPT2" dump resources "$APK" > /tmp/rvaz-resources.txt
            python3 - "$APK" <<'PY'
          import re,sys,zipfile,io
          from pathlib import Path
          from PIL import Image
          resources=Path('/tmp/rvaz-resources.txt').read_text()
          block=next(b for b in re.split(r'(?=resource 0x)',resources) if 'mipmap/ic_launcher\n' in b)
          icons=re.findall(r'\(([^)]+)\).*?(res/\S+\.png)',block)
          assert len(icons)==5
          with zipfile.ZipFile(sys.argv[1]) as apk:
              for density,name in icons:
                  actual=Image.open(io.BytesIO(apk.read(name))).convert('RGBA')
                  original=Image.open(Path('android-icon-original/res') / ('mipmap-'+density.split('-')[0]) / 'ic_launcher.png').convert('RGBA')
                  assert actual.size==original.size
                  assert actual.tobytes()==original.tobytes(), (sys.argv[1],density)
          print('Verified exact original Android launcher pixels:',sys.argv[1])
          PY
          done
      - name: Save renderer evidence on development branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = ios-current-features-safe
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/screenshots
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified native Wonen renderer screenshot'
            git push origin HEAD:ios-current-features-safe
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: RVAZ-native-Wonen-renderer
          path: verification/screenshots/*.png
          if-no-files-found: error
