name: Validate RVAZ Wonen and iOS AdMob changes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-current-features-safe
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Run tests when present
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo 'No Flutter test files in repository; analysis completed, tests skipped.'
          fi
