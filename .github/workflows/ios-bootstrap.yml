name: Build RVAZ iOS App Store IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      BUNDLE_ID: nl.regiovoorneaanzee.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ios-bootstrap-v36

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Flutter project
        run: |
          flutter analyze --no-fatal-infos
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo 'Geen Flutter-tests gevonden; teststap overgeslagen.'
          fi

      - name: Install Apple signing credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$BUILD_PROVISION_PROFILE_BASE64"
          test -n "$KEYCHAIN_PASSWORD"

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST")
          case "$PROFILE_APP_ID" in
            *."$BUNDLE_ID") ;;
            *) echo "Provisioning profile does not match $BUNDLE_ID"; exit 1 ;;
          esac

      - name: Create App Store export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>XQ8MH83ZV9</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>nl.regiovoorneaanzee.app</key>
              <string>RVAZ App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Restore RVAZ iOS app icons
        shell: bash
        run: |
          set -euo pipefail
          # Use the exact iOS icon uploaded for build 41. It is already visually final.
          # Convert only the PNG color model to RGB/no-alpha; do not crop, pad or zoom.
          SOURCE_ICON="assets/cropped-LogoRegio0181.png"
          test -f "$SOURCE_ICON"
          test "$(sips -g pixelWidth "$SOURCE_ICON" | awk '/pixelWidth/ {print $2}')" = "512"
          test "$(sips -g pixelHeight "$SOURCE_ICON" | awk '/pixelHeight/ {print $2}')" = "512"
          sips -s format jpeg -s formatOptions 100 "$SOURCE_ICON" --out /tmp/rvaz-app-icon-rgb.jpg >/dev/null
          sips -s format png /tmp/rvaz-app-icon-rgb.jpg --out /tmp/rvaz-app-icon.png >/dev/null
          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          while IFS='|' read -r file pixels; do
            sips -z "$pixels" "$pixels" /tmp/rvaz-app-icon.png --out "$ICON_DIR/$file" >/dev/null
          done <<'ICONS'
          Icon-App-20x20@1x.png|20
          Icon-App-20x20@2x.png|40
          Icon-App-20x20@3x.png|60
          Icon-App-29x29@1x.png|29
          Icon-App-29x29@2x.png|58
          Icon-App-29x29@3x.png|87
          Icon-App-40x40@1x.png|40
          Icon-App-40x40@2x.png|80
          Icon-App-40x40@3x.png|120
          Icon-App-60x60@2x.png|120
          Icon-App-60x60@3x.png|180
          Icon-App-76x76@1x.png|76
          Icon-App-76x76@2x.png|152
          Icon-App-83.5x83.5@2x.png|167
          Icon-App-1024x1024@1x.png|1024
          ICONS
          test "$(sips -g pixelWidth "$ICON_DIR/Icon-App-1024x1024@1x.png" | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelHeight "$ICON_DIR/Icon-App-1024x1024@1x.png" | awk '/pixelHeight/ {print $2}')" = "1024"
          test "$(sips -g hasAlpha "$ICON_DIR/Icon-App-1024x1024@1x.png" | awk '/hasAlpha/ {print $2}')" = "no"

      - name: Build Flutter iOS release without signing
        run: |
          flutter build ios --release --no-codesign --build-name=1.1.3 --build-number=63

      - name: Archive with Apple Distribution signing
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM=XQ8MH83ZV9 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Export signed App Store IPA
        run: |
          set -euo pipefail
          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RVAZ-iOS-AppStore
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
