name: Build RVAZ iOS current Android features

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      BUNDLE_ID: nl.regiovoorneaanzee.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-current-features-safe

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify current shared Flutter app
        run: flutter analyze --no-fatal-infos

      - name: Verify proven native iOS identity
        run: |
          set -euo pipefail
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist ios/Runner/GoogleService-Info.plist
          test -f ios/Runner/AppDelegate.swift
          test -f ios/Runner/Runner-Bridging-Header.h
          test -f ios/Runner/SceneDelegate.swift
          test -f ios/Runner/Runner.entitlements
          grep -q 'nl.regiovoorneaanzee.app' ios/Runner.xcodeproj/project.pbxproj
          git fetch --no-tags origin e7bc87ea017399ef7db76b1f43de7dd8e8ed9494
          test "$(git rev-parse FETCH_HEAD)" = "e7bc87ea017399ef7db76b1f43de7dd8e8ed9494"
          python3 - <<'PY'
          import json, pathlib, subprocess
          directory = pathlib.Path("ios/Runner/Assets.xcassets/AppIcon.appiconset")
          data = json.loads((directory / "Contents.json").read_text())
          filenames = sorted({item["filename"] for item in data["images"] if item.get("filename")})
          for filename in filenames:
              path = directory / filename
              assert path.is_file(), f"Missing original icon: {path}"
              expected = subprocess.check_output(["git", "rev-parse", f"FETCH_HEAD:{path}"], text=True).strip()
              actual = subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
              assert actual == expected, f"Icon differs from original: {path}"
          print(f"Verified {len(filenames)} exact historical icon files")
          PY
          git diff --exit-code FETCH_HEAD -- ios/Runner.xcodeproj/project.pbxproj ios/Runner/AppDelegate.swift ios/Runner/Info.plist ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig ios/Flutter/AppFrameworkInfo.plist ios/Runner/Base.lproj/LaunchScreen.storyboard ios/Runner/Base.lproj/Main.storyboard ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme ios/Runner.xcworkspace/xcshareddata/IDEWorkspaceChecks.plist ios/Runner.xcworkspace/xcshareddata/WorkspaceSettings.xcsettings ios/Runner/GoogleService-Info.plist ios/Runner/Runner-Bridging-Header.h ios/Runner/SceneDelegate.swift ios/Runner/Runner.entitlements

      - name: Install Apple signing credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Create App Store export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>XQ8MH83ZV9</string>
          <key>provisioningProfiles</key><dict><key>nl.regiovoorneaanzee.app</key><string>RVAZ App Store</string></dict>
          </dict></plist>
          PLIST

      - name: Build current shared app on proven iOS project
        run: flutter build ios --release --no-codesign --build-name=1.1.4 --build-number=82

      - name: Archive with proven signing settings
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" DEVELOPMENT_TEAM=XQ8MH83ZV9 CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" archive

      - name: Export signed TestFlight IPA
        run: |
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" -exportPath build/ios/ipa -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: RVAZ-iOS-1.1.4-build82-current-features
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
