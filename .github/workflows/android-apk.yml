name: Build RVAZ Android APK
# Trigger build for closed-test version 0.4.1+5
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org nl.regiovoorneaanzee --project-name rvaz_android .
      - name: Configure Firebase Android
        run: |
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle.kts')
          s = settings.read_text()
          needle = 'plugins {'
          s = s.replace(needle, needle + '\n    id("com.google.gms.google-services") version "4.4.4" apply false', 1)
          settings.write_text(s)
          app = Path('android/app/build.gradle.kts')
          a = app.read_text()
          a = a.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
          app.write_text(a)
          PY
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Get packages
        run: flutter pub get
      - name: Prepare RVAZ Android app icon
        run: |
          ICON_SOURCE=""
          if [ -f "assets/images/app_icon.png" ]; then ICON_SOURCE="assets/images/app_icon.png"; fi
          if [ -z "$ICON_SOURCE" ] && [ -f "assets/app_icon.png" ]; then ICON_SOURCE="assets/app_icon.png"; fi
          if [ -z "$ICON_SOURCE" ]; then
            API="https://regiovoorneaanzee.nl/wp-json/rvaz-app/v1/config"
            if curl -4 --fail --location --connect-timeout 10 --max-time 25 "$API" -o /tmp/rvaz-config.json; then
              ICON_URL=$(python3 -c "import json; d=json.load(open('/tmp/rvaz-config.json')); print(d.get('app_icon_url') or d.get('app_icon') or '')")
              if [ -n "$ICON_URL" ] && curl -4 --fail --location --connect-timeout 10 --max-time 30 "$ICON_URL" -o /tmp/rvaz-icon-source; then
                ICON_SOURCE="/tmp/rvaz-icon-source"
              fi
            fi
          fi
          if [ -z "$ICON_SOURCE" ]; then
            echo "App API tijdelijk onbereikbaar; bestaande Flutter launcher iconen blijven behouden."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y imagemagick >/dev/null
          convert "$ICON_SOURCE" -strip /tmp/rvaz-icon.png
          for spec in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            dir="${spec%%:*}"; size="${spec##*:}"
            mkdir -p "android/app/src/main/res/$dir"
            convert /tmp/rvaz-icon.png -resize "${size}x${size}" "android/app/src/main/res/$dir/ic_launcher.png"
          done
      - name: Analyze
        run: flutter analyze
      - name: Configure RVAZ app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = m.replace('android:label="rvaz_android"', 'android:label="Regio Voorne aan Zee"')
          permission = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          if permission not in m:
              m = m.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n    ' + permission, 1)
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in m:
              close = m.find('>', m.find('<application'))
              m = m[:close+1] + '\\n        ' + meta + m[close+1:]
          manifest.write_text(m)
          PY
      - name: Configure Google Play release signing
        env:
          RVAZ_KEYSTORE_BASE64: ${{ secrets.RVAZ_KEYSTORE_BASE64 }}
          RVAZ_KEYSTORE_PASSWORD: ${{ secrets.RVAZ_KEYSTORE_PASSWORD }}
          RVAZ_KEY_PASSWORD: ${{ secrets.RVAZ_KEY_PASSWORD }}
        run: |
          test -n "$RVAZ_KEYSTORE_BASE64" || { echo "RVAZ_KEYSTORE_BASE64 ontbreekt"; exit 1; }
          test -n "$RVAZ_KEYSTORE_PASSWORD" || { echo "RVAZ_KEYSTORE_PASSWORD ontbreekt"; exit 1; }
          test -n "$RVAZ_KEY_PASSWORD" || { echo "RVAZ_KEY_PASSWORD ontbreekt"; exit 1; }
          printf '%s' "$RVAZ_KEYSTORE_BASE64" | base64 --decode > android/app/rvaz-upload.jks
          keytool -list -keystore android/app/rvaz-upload.jks -storepass "$RVAZ_KEYSTORE_PASSWORD" >/dev/null
          DETECTED_ALIAS=$(keytool -list -v -keystore android/app/rvaz-upload.jks -storepass "$RVAZ_KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)
          test -n "$DETECTED_ALIAS" || { echo "Geen sleutelalias gevonden"; exit 1; }
          printf '%s\n' "storePassword=$RVAZ_KEYSTORE_PASSWORD" "keyPassword=$RVAZ_KEY_PASSWORD" "keyAlias=$DETECTED_ALIAS" "storeFile=rvaz-upload.jks" > android/key.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'java.util.Properties' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + s
          setup = 'val keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nkeystoreProperties.load(FileInputStream(keystorePropertiesFile))\n\n'
          if 'val keystoreProperties = Properties()' not in s:
              s = s.replace('android {', setup + 'android {', 1)
          if 'create("release")' not in s:
              signing = '    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n'
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY
      - name: Build signed release APKs per architecture
        run: flutter build apk --release --split-per-abi
      - name: Build signed Google Play app bundle
        run: flutter build appbundle --release
      - name: Verify release signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab >/dev/null
          echo "Release APKs en AAB zijn ondertekend."
      - name: Verify APK package
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$AAPT" dump badging "$APK" | grep "package: name='nl.regiovoorneaanzee.rvaz_android'"
            "$AAPT" dump badging "$APK" | grep "application-label:'Regio Voorne aan Zee'"
          done
      - name: Publish easy phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk RVAZ-Android-arm64.apk
          gh release delete test-latest --cleanup-tag -y || true
          gh release create test-latest RVAZ-Android-arm64.apk \
            --title "RVAZ Android - nieuwste testversie" \
            --notes "Nieuwste geteste ARM64-versie voor Android. Tik op RVAZ-Android-arm64.apk om te downloaden." \
            --prerelease
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: RVAZ-Android-small-release-APKs
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: RVAZ-Google-Play-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
