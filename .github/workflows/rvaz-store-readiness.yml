name: Read-only Wonen store payment readiness
on:
  push:
    branches: [ios-current-features-safe]
    paths: ['.github/workflows/rvaz-store-readiness.yml', 'verification/store-payments/catalog.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Apple in-app product catalog without changes
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet PyJWT cryptography --break-system-packages
          python3 verification/store-payments/catalog.py
