name: RVAZ safe branch checks
on:
  push:
    branches: [ios-current-features-safe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos
      - name: Test Flutter
        run: flutter test
      - name: Confirm native property pages
        run: |
          ! grep -q 'WebViewWidget' lib/wonen.dart
          grep -q 'WoningDetailPage(item: item)' lib/wonen.dart
          grep -q "title:const Text('Mijn Wonen'" lib/main.dart
      - name: Verify exact RVAZ icon assets
        run: python3 scripts/verify_icons.py
