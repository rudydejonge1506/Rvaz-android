name: Verify signed RVAZ 67 and upload iOS 104
on:
  push:
    branches: [feature/newsroom-design]
    paths: ['.github/workflows/newsroom-verify-upload.yml', 'verification/newsroom/**']
  workflow_dispatch:
concurrency:
  group: rvaz-newsroom-release-104
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  android-verification:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact signed newsroom APK
        run: |
          gh run download 41424874626 --repo "$GITHUB_REPOSITORY" --name RVAZ-Google-Play-67-candidate --dir candidate
          APK=$(find candidate -name app-release.apk -print -quit)
          test -n "$APK"
          echo "RVAZ_TEST_APK=$APK" >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real news, family page and vouchers on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install "$RVAZ_TEST_APK"
            adb logcat -c
            python3 verification/newsroom/verify_android_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RVAZ-67-newsroom-screen-verification
          path: evidence/
          if-no-files-found: error
  apple-upload:
    needs: android-verification
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact signed iOS 1.2.0 build 104
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41424874613 --repo "$GITHUB_REPOSITORY" --name RVAZ-iOS-1.2.0-build104-newsroom --dir ipa
          python3 - <<'PY'
          import glob,zipfile,plistlib
          files=glob.glob('ipa/**/*.ipa',recursive=True)
          assert len(files)==1
          with zipfile.ZipFile(files[0]) as z:
              names=[n for n in z.namelist() if n.startswith('Payload/') and n.count('/')==2 and n.endswith('/Info.plist')]
              assert len(names)==1
              info=plistlib.loads(z.read(names[0]))
              assert info['CFBundleIdentifier']=='nl.regiovoorneaanzee.app'
              assert info['CFBundleVersion']=='104'
              assert info['CFBundleShortVersionString']=='1.2.0'
              assert info.get('CFBundleIcons')
          PY
      - name: Check the next build number against Apple
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet PyJWT cryptography --break-system-packages
          python3 scripts/check_newsroom_version.py
      - name: Validate and upload the verified signed IPA
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          printf '%s\n' "$API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          IPA=$(find ipa -name '*.ipa' -print -quit)
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
      - name: Verify TestFlight processing
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: python3 scripts/verify_testflight.py
      - name: Remove the temporary API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"
