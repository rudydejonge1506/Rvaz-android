name: Build RVAZ Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org nl.regiovoorneaanzee --project-name rvaz_android .
      - name: Configure Firebase Android
        run: |
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle.kts')
          s = settings.read_text()
          needle = 'plugins {'
          s = s.replace(needle, needle + '\n    id("com.google.gms.google-services") version "4.4.4" apply false', 1)
          settings.write_text(s)
          app = Path('android/app/build.gradle.kts')
          a = app.read_text()
          a = a.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
          app.write_text(a)
          PY
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Get packages
        run: flutter pub get
      - name: Prepare API-managed Android app icon
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          try:
              with urllib.request.urlopen('https://regiovoorneaanzee.nl/wp-json/rvaz-app/v1/config', timeout=20) as r:
                  cfg=json.load(r)
              url=(cfg.get('app_icon_url') or '').strip()
              if url:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      Path('assets/rvaz-app-icon.png').write_bytes(r.read())
                  p=Path('pubspec.yaml')
                  t=p.read_text().replace('image_path: assets/rvaz-logo.png','image_path: assets/rvaz-app-icon.png').replace('adaptive_icon_foreground: assets/rvaz-logo.png','adaptive_icon_foreground: assets/rvaz-app-icon.png')
                  p.write_text(t)
                  print('Using app icon from RVAZ App API')
              else:
                  print('No API app icon configured; using exact RVAZ logo fallback')
          except Exception as e:
              print('API icon unavailable; using repository fallback:', e)
          PY
          echo "Launcher icon generation skipped; bundled RVAZ assets retained"
      - name: Analyze
        run: flutter analyze
      - name: Configure RVAZ app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = m.replace('android:label="rvaz_android"', 'android:label="Regio Voorne aan Zee"')
          manifest.write_text(m)
          PY
      - name: Build smaller release APKs per architecture
        run: flutter build apk --release --split-per-abi
      - name: Sign APKs with stable RVAZ test key
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$APKSIGNER" sign \
              --ks android-signing/rvaz-test.jks \
              --ks-key-alias rvaztest \
              --ks-pass pass:rvaz-test-2026 \
              --key-pass pass:rvaz-test-2026 \
              "$APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done
      - name: Verify APK package
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$AAPT" dump badging "$APK" | grep "package: name='nl.regiovoorneaanzee.rvaz_android'"
            "$AAPT" dump badging "$APK" | grep "application-label:'Regio Voorne aan Zee'"
          done
      - name: Publish easy phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk RVAZ-Android-arm64.apk
          gh release delete test-latest --cleanup-tag -y || true
          gh release create test-latest RVAZ-Android-arm64.apk \
            --title "RVAZ Android - nieuwste testversie" \
            --notes "Nieuwste geteste ARM64-versie voor Android. Tik op RVAZ-Android-arm64.apk om te downloaden." \
            --prerelease
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: RVAZ-Android-small-release-APKs
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
